version: '3.8'

services:
  # ── Express API + React frontend ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-adssu}
      DB_PASSWORD: ${DB_PASSWORD:-adssu_password}
      DB_NAME: ${DB_NAME:-adssu_scheduling}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000}
      OR_TOOLS_SERVICE_URL: http://or-tools:8001
    depends_on:
      mysql:
        condition: service_healthy
      or-tools:
        condition: service_started

  # ── Google OR-Tools CP-SAT solver microservice ────────────────────────────
  or-tools:
    build:
      context: ./or-tools-service
      dockerfile: Dockerfile
    restart: always

  # ── MariaDB database ──────────────────────────────────────────────────────
  mysql:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-adssu_scheduling}
      MYSQL_USER: ${DB_USER:-adssu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-adssu_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb", "-u${DB_USER:-adssu}", "-p${DB_PASSWORD:-adssu_password}", "${DB_NAME:-adssu_scheduling}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
